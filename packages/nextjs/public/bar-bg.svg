<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#FFDF73" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFF2CE" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#FFDF73" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- Subtle diagonal gold lines -->
  <line x1="0" y1="0" x2="400" y2="900" stroke="url(#goldLine)" stroke-width="1"/>
  <line x1="200" y1="0" x2="600" y2="900" stroke="url(#goldLine)" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="900" y2="900" stroke="url(#goldLine)" stroke-width="0.8"/>
  <line x1="1200" y1="0" x2="1100" y2="900" stroke="url(#goldLine)" stroke-width="0.5"/>
  <line x1="1400" y1="0" x2="1300" y2="900" stroke="url(#goldLine)" stroke-width="0.3"/>

  <!-- Wine bottle silhouette -->
  <g transform="translate(720,420)" opacity="0.08">
    <!-- Bottle body -->
    <rect x="-25" y="-30" width="50" height="120" rx="8" fill="#D4AF37"/>
    <rect x="-15" y="-80" width="30" height="55" rx="4" fill="#D4AF37"/>
    <rect x="-10" y="-100" width="20" height="25" rx="3" fill="#D4AF37"/>
    <!-- Label -->
    <rect x="-20" y="10" width="40" height="50" rx="3" fill="#0d0d0d" stroke="#D4AF37" stroke-width="1"/>
  </g>

  <!-- Wine glass silhouette left -->
  <g transform="translate(400,430)" opacity="0.06">
    <path d="M-20,0 Q-25,-60 0,-80 Q25,-60 20,0 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="-15" y="35" width="30" height="8" rx="3" fill="#D4AF37"/>
  </g>

  <!-- Wine glass silhouette right -->
  <g transform="translate(1040,420)" opacity="0.06">
    <path d="M-20,0 Q-25,-60 0,-80 Q25,-60 20,0 Z" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="-15" y="35" width="30" height="8" rx="3" fill="#D4AF37"/>
  </g>

  <!-- Horizontal gold accent line -->
  <line x1="320" y1="600" x2="1120" y2="600" stroke="url(#goldBar)" stroke-width="1"/>

  <!-- Bottom glow -->
  <ellipse cx="720" cy="850" rx="300" ry="40" fill="#C9A84C" opacity="0.03" filter="url(#softGlow)"/>

  <!-- Sparkle dots -->
  <circle cx="350" cy="200" r="1.5" fill="#C9A84C" opacity="0.3"/>
  <circle cx="1100" cy="180" r="1" fill="#C9A84C" opacity="0.25"/>
  <circle cx="550" cy="150" r="1.2" fill="#C9A84C" opacity="0.2"/>
  <circle cx="900" cy="130" r="1" fill="#C9A84C" opacity="0.3"/>
  <circle cx="250" cy="500" r="1.5" fill="#C9A84C" opacity="0.15"/>
  <circle cx="1200" cy="480" r="1" fill="#C9A84C" opacity="0.2"/>
</svg>
