<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>

  <!-- Glow center -->
  <circle cx="600" cy="250" r="250" fill="url(#glow)"/>

  <!-- Top gold line -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#goldBar)"/>

  <!-- Bottom gold line -->
  <rect x="0" y="499" width="1200" height="1" fill="url(#goldBar)"/>

  <!-- Decorative lines -->
  <line x1="100" y1="80" x2="400" y2="80" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>
  <line x1="800" y1="80" x2="1100" y2="80" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="420" x2="400" y2="420" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>
  <line x1="800" y1="420" x2="1100" y2="420" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>

  <!-- Wine glass left -->
  <g transform="translate(200, 200)" opacity="0.12">
    <path d="M-30,0 Q-40,-80 0,-110 Q40,-80 30,0 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#D4AF37" stroke-width="2"/>
    <ellipse cx="0" cy="60" rx="25" ry="6" fill="#D4AF37"/>
    <line x1="-15" y1="75" x2="15" y2="75" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Wine inside -->
    <path d="M-20,30 Q-25,-30 0,-55" stroke="#8B0000" stroke-width="8" fill="none" opacity="0.4"/>
  </g>

  <!-- Wine glass right -->
  <g transform="translate(1000, 190)" opacity="0.12">
    <path d="M-30,0 Q-40,-80 0,-110 Q40,-80 30,0 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="#D4AF37" stroke-width="2"/>
    <ellipse cx="0" cy="60" rx="25" ry="6" fill="#D4AF37"/>
    <line x1="-15" y1="75" x2="15" y2="75" stroke="#D4AF37" stroke-width="1.5"/>
  </g>

  <!-- Center bar counter -->
  <rect x="460" y="320" width="280" height="15" rx="3" fill="#3a2a1a" opacity="0.3"/>
  <rect x="470" y="335" width="260" height="3" fill="#C9A84C" opacity="0.15"/>

  <!-- Bottles on bar -->
  <g opacity="0.15">
    <!-- Bottle 1 -->
    <rect x="500" y="250" width="18" height="70" rx="3" fill="#C9A84C"/>
    <rect x="506" y="235" width="6" height="18" fill="#C9A84C"/>
    <!-- Bottle 2 -->
    <rect x="540" y="240" width="16" height="80" rx="3" fill="#C9A84C"/>
    <rect x="545" y="225" width="6" height="18" fill="#C9A84C"/>
    <!-- Bottle 3 -->
    <rect x="580" y="260" width="20" height="60" rx="3" fill="#C9A84C"/>
    <rect x="587" y="245" width="6" height="18" fill="#C9A84C"/>
    <!-- Bottle 4 -->
    <rect x="625" y="245" width="16" height="75" rx="3" fill="#C9A84C"/>
    <rect x="630" y="230" width="6" height="18" fill="#C9A84C"/>
    <!-- Bottle 5 -->
    <rect x="665" y="255" width="18" height="65" rx="3" fill="#C9A84C"/>
    <rect x="671" y="240" width="6" height="18" fill="#C9A84C"/>
    <!-- Bottle 6 -->
    <rect x="705" y="248" width="16" height="72" rx="3" fill="#C9A84C"/>
    <rect x="710" y="233" width="6" height="18" fill="#C9A84C"/>
  </g>

  <!-- Tag shapes -->
  <g transform="translate(400, 140)" opacity="0.08">
    <rect x="-30" y="-15" width="60" height="30" rx="3" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="4" fill="#0f0f1a"/>
  </g>
  <g transform="translate(800, 155)" opacity="0.08">
    <rect x="-30" y="-15" width="60" height="30" rx="3" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="4" fill="#0f0f1a"/>
  </g>

  <!-- Small sparkles -->
  <circle cx="350" cy="120" r="1.5" fill="#C9A84C" opacity="0.3"/>
  <circle cx="850" cy="110" r="2" fill="#C9A84C" opacity="0.25"/>
  <circle cx="600" cy="370" r="1" fill="#C9A84C" opacity="0.2"/>
  <circle cx="280" cy="350" r="1.5" fill="#C9A84C" opacity="0.15"/>
  <circle cx="920" cy="340" r="1" fill="#C9A84C" opacity="0.2"/>
</svg>
